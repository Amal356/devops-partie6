# TP16 : résolution des noms *.lab.local À L'INTÉRIEUR du cluster (oauth2-proxy doit joindre Keycloak
# par le même nom que le navigateur, sinon l'émetteur des jetons ne correspond pas).
# K3s charge automatiquement les clés *.server de ce ConfigMap dans CoreDNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  lab.server: |
    lab.local:53 {
      hosts {
        10.0.2.15 whoami.lab.local keycloak.lab.local
      }
    }
# COMPLÉTÉ : 10.0.2.15 = InternalIP du nœud K3s (VM de lab, NAT VirtualBox), qui expose Traefik.
# Le script 3-keycloak.sh remplace automatiquement cette IP par la vraie InternalIP du nœud,
# puis redémarre CoreDNS : kubectl -n kube-system rollout restart deploy/coredns
