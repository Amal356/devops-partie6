# TP18 partie 5 : synchronise le secret Secrets Manager "tp18/db-password" dans le Secret "db-credentials".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tp18
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: floci
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: "tp18/db-password" # nom du secret dans Secrets Manager (chaîne simple, pas de property)
