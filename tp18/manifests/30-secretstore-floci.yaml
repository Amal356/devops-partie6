# TP18 partie 5 : seconde source, AWS Secrets Manager émulé par Floci (TP13).
# Le Secret floci-creds (identifiants FICTIFS test/test) est créé en ligne de commande, pas dans Git.
# L'endpoint Floci est donné au contrôleur ESO par la variable AWS_SECRETSMANAGER_ENDPOINT (helm upgrade).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci
  namespace: tp18
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-creds
            key: access-key
          secretAccessKeySecretRef:
            name: floci-creds
            key: secret-access-key
