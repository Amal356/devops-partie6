# TP17 partie 4 : segmentation réseau du namespace (K3s applique les NetworkPolicies nativement).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tp17
spec:
  podSelector: {} # tous les Pods du namespace
  policyTypes: ["Ingress", "Egress"]
---
# COMPLÉTÉ : DNS sortant (UDP/TCP 53) vers les Pods kube-dns du namespace kube-system,
# sinon plus aucun nom de Service n'est résolu.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tp17
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# COMPLÉTÉ : l'API n'accepte que le trafic venant des Pods tier=frontend, sur le port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-frontend
  namespace: tp17
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: frontend }
      ports:
        - { protocol: TCP, port: 8080 } # port du conteneur (le Service 80 -> 8080 est traduit avant)
---
# COMPLÉTÉ : règle egress correspondante : le frontend peut sortir vers l'API (port 8080) uniquement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-egress-api
  namespace: tp17
spec:
  podSelector:
    matchLabels: { tier: frontend }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - { protocol: TCP, port: 8080 }
