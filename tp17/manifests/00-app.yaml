# TP17 : application de démonstration, VOLONTAIREMENT non sécurisée (fichier d'origine, conservé
# pour comparer : Kyverno CLI et Kubescape "avant"). La version durcie est 01-app-hardened.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: tp17
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp17
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      containers:
        - name: api
          image: traefik/whoami:latest # [À CORRIGER] tag latest
          args: ["--port", "8080"]
          ports: [{ containerPort: 8080 }]
          securityContext:
            privileged: true # [À CORRIGER]
          # [À CORRIGER] aucune requests/limits
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp17
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp17
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: nginx:1.29 # [À CORRIGER] s'exécute en root : préférer nginxinc/nginx-unprivileged
          ports: [{ containerPort: 80 }]
---
# Pod "intrus" : il ne devrait PAS pouvoir joindre l'API une fois les NetworkPolicies en place.
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: tp17
  labels: { app: intruder }
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "infinity"]
